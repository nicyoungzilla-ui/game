<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D First-Person Movement Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="game" aria-label="3D first-person movement demo"></canvas>

    <section id="start-screen" class="overlay">
      <div class="panel">
        <h1>First-Person Controller</h1>
        <p>Click to lock the pointer and enter the training arena.</p>
        <ul>
          <li><strong>WASD</strong> move</li>
          <li><strong>Mouse</strong> look</li>
          <li><strong>Space</strong> jump</li>
          <li><strong>Esc</strong> release pointer</li>
        </ul>
        <button id="start-button" type="button">Start</button>
      </div>
    </section>

    <section id="pause-screen" class="overlay hidden">
      <div class="panel compact">
        <h2>Paused</h2>
        <p>Click the game to resume pointer lock.</p>
      </div>
    </section>

    <aside class="hud" aria-live="polite">
      <div><strong>WASD</strong> Move</div>
      <div><strong>Space</strong> Jump</div>
      <div><strong>Mouse</strong> Look</div>
      <div id="status">Click Start to play</div>
    </aside>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
